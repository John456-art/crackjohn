<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به سیستم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
    <style> body { font-family: 'Vazirmatn', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-indigo-400">ورود به سیستم پردازش</h1>
            <p class="text-xs text-slate-400">کلید لایسنس خود را جهت ورود وارد نمایید</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 rounded-xl text-xs bg-red-500/10 border border-red-500/20 text-red-400 text-center">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">کلید لایسنس / کلید ادمین:</label>
                <input type="text" name="access_key" required placeholder="به یادتم قناری" dir="ltr"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 font-mono text-center text-emerald-400 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 font-bold rounded-xl shadow-lg transition text-sm">
                ورود به پنل
            </button>
        </form>
    </div>
</body>
</html>
